name = "autopriniyatie-bot"
main = "src/index.ts"
compatibility_date = "2024-12-18"

[observability]
enabled = true

[[kv_namespaces]]
binding = "BOT_KV"
id = "e63fbecd5d9c473eb087684a05b877c3"

[[d1_databases]]
binding = "DB"
database_name = "autopriniyatie-bot-db"
database_id = "307e687e-9dd6-4046-a276-d79ddaa8f328"
migrations_dir = "migrations"

[[queues.producers]]
binding = "BROADCAST_QUEUE"
queue = "autopriniyatie-broadcasts"

[[queues.consumers]]
queue = "autopriniyatie-broadcasts"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "autopriniyatie-broadcasts-dlq"
max_concurrency = 1

[triggers]
crons = ["* * * * *"]
